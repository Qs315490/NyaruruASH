[project]
name = "nyaruru-ash"
version = "0.1.0"
description = "ASH (Agents that Self-Hone via Embodied Learning) for Nyaruru Fishy Fight, CDP backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "pyyaml>=6.0",
    "websockets>=13.0",
    "aiohttp>=3.10",
    "einops>=0.8",
    "tqdm>=4.66",
    "opencv-python>=5.0.0.93",
    "hdbscan>=0.8.40",
]

# torch defaults to the CPU wheel on PyPI, so a plain install works everywhere
# and stays small.  GPU builds live in separate extras because they resolve from
# vendor indexes (see [tool.uv.sources]); the indexes are declared `explicit`
# so they are never consulted for unrelated packages.
[project.optional-dependencies]
cpu = ["torch>=2.9"]
train = ["torch>=2.9", "tensorboard>=2.18"]
# AMD: the nightly repo ships per-device kernel packages, so the GPU tag is part
# of the requirement.  gfx1101 is the RX 7700 XT; for another GPU replace the
# tag (gfx1100, gfx1102, ...) or use the per-family build `device-gfx110X-all`.
rocm = ["torch[device-gfx1101]>=2.15.0a0", "tensorboard>=2.18"]
nvidia = ["torch>=2.9", "tensorboard>=2.18"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv]
# The CPU wheel lives on PyPI, so a plain install stays small and portable; the
# GPU builds are extras that resolve from vendor indexes.
#
# unsafe-best-match is required: with the default strategy uv stops at the first
# index that satisfies a requirement, so the CPU wheel on PyPI would always win
# and the GPU build would be silently skipped.
index-strategy = "unsafe-best-match"
# uv resolves a project universally (every extra at once).  Each torch-carrying
# extra routes torch to a different index, which would ask for one package from
# two indexes at once; declaring them mutually exclusive makes each resolve on
# its own.  Install exactly one.
conflicts = [
    [{ extra = "cpu" }, { extra = "train" }, { extra = "rocm" }, { extra = "nvidia" }],
]

[[tool.uv.index]]
# Deliberately NOT explicit: torch's transitive dependencies (rocm, rocm-sdk-*,
# amd-torch-device-*) live on this same index.  An explicit index would serve
# only the routed `torch` and leave those unresolvable on PyPI.
name = "amd-rocm"
url = "https://nightly.repo.amd.com/rocm/whl-next/"

[[tool.uv.index]]
name = "pytorch-cu"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "amd-rocm", extra = "rocm" },
    { index = "pytorch-cu", extra = "nvidia" },
]

[project.scripts]
ash = "ash.cli.main:main"

[tool.hatch.build.targets.wheel.force-include]
# agent.js must ship inside the wheel: js_source() reads it at runtime.
"src/ash/memory/agent.js" = "ash/memory/agent.js"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ash"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP031", "UP032"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
