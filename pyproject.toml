[project]
name = "nyaruru-ash"
version = "0.1.0"
description = "ASH (Agents that Self-Hone via Embodied Learning) for Nyaruru Fishy Fight, CDP backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1",
    "pyyaml>=6.0",
    "websockets>=13.0",
    "aiohttp>=3.10",
    "einops>=0.8",
    "tqdm>=4.66",
    "opencv-python>=5.0.0.93",
    "hdbscan>=0.8.40",
]

[project.optional-dependencies]
train = ["torch>=2.9", "tensorboard>=2.18"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
ash = "ash.cli.main:main"

[tool.hatch.build.targets.wheel.force-include]
# agent.js must ship inside the wheel: js_source() reads it at runtime.
"src/ash/memory/agent.js" = "ash/memory/agent.js"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ash"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP031", "UP032"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
