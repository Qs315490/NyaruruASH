# 游戏与运行参数
#
# 这里只放「已核实」或「需要实测确认」的参数，其余一律由 Phase 0 探针产出。
name: 咸鱼喵喵 / Nyaruru Fishy Fight
steam_appid: 1478160          # Steam app id（已核实）
speedrun_game: w6j7mg76       # speedrun.com game id（已核实）
speedrun_category: n2yx001d   # Ending 1 分类 id（已核实，WR 2418s）
cdp_port: 9222
cdp_endpoint: http://127.0.0.1:9222
fps: 60                       # RPG Maker MZ 的 SceneManager 逻辑帧率

# 控制间隔 = 相邻两次「观测 + 动作」之间隔多少游戏时间（秒）。
#
# 这是**整条流水线唯一的时间尺度来源**，必须显式写出来：它一旦是隐式的就会静默毁掉
# 一切。实测踩过：agent 每步只推进 1 游戏帧（1/60 s），而语料按 2 s 抽帧，于是 IDM
# 学的是「解释 1/60 s 变化的那一个动作」，却被拿来标注相隔 2 s 的帧——它 99.8% 的
# 时候只输出同一个类，π 便靠预测这个常数类「收敛」到 policy_val ~1e-6。
#
# 论文（Appendix G）用 0.25 s 作环境 timestep、语料同尺度；这里照抄，并让 agent 步长
# （control_frame_skip = 0.25*60 = 15 帧）与语料抽帧率（corpus_fps = 1/0.25 = 4 fps）
# 都由它派生。
control_interval_s: 0.25

# 难度雕像那一屏**没有取消键**（实测三种选项：按下简单/普通/困难难度按钮），
# 所以只能选一个。选不出来就会把游戏永久卡在那一屏，并且让它到达的每一轮中止。
# 这里是**由操作者预置**的答案：填游戏里的选项原文（或从 1 数起的序号），留空 = 拒绝。
#
# 默认「简单」的理由：语料是速通录像，速通都在简单难度下跑；让 agent 在别的难度上
# 玩、却拿简单难度的录像当监督信号，等于在比较两个不同的游戏。要按难度分开训练，
# 改这一行（或每次用 --difficulty 覆盖），而不是把它们混在一起。
difficulty_preset: 简单

window:
  title_contains: ["Nyaruru", "咸鱼喵喵"]
  capture:                    # X11 后端（保底方案）的抓取区域，需按实际窗口调整
    x: 0
    y: 0
    width: 1280
    height: 720

# 键位映射
#
# RPG Maker MZ 默认按键表（Input.keyMapper）：Z/Enter/Space = ok，X/Esc = cancel，
# Shift = dash，方向键 = 移动。动作游戏通常还会用到 X（攻击）与 Shift（冲刺）。
# 但本游戏的实际绑定尚未实测，Phase 0 的 probe 会在游戏内逐键验证并回写本文件。
# 键位映射 —— 已按游戏内「控制设置」页面核实（2026-09-20 截图）
#
# 游戏内绑定：
#   上/下/左/右 = 方向键；确定 = Z（可重复）；取消 = X（可重复）
#   跳跃 = Z；咸鱼攻击 = X；冲刺 = C；咸鱼技能 = V；必杀技 = A
#   打开菜单 = ESC；显示地图 = M；使用物品 = F；更换武器 = S；快速读档 = D
#   视角移动 = J/I/K
#
# 动作字典只建模速通需要的控制；快速读档 D 被有意排除（速通中按它等于作弊，
# 且会污染示范数据）。
keymap:
  up:
    names: [ArrowUp]
    codes: [ArrowUp]
    keycodes: [38]
  down:
    names: [ArrowDown]
    codes: [ArrowDown]
    keycodes: [40]
  left:
    names: [ArrowLeft]
    codes: [ArrowLeft]
    keycodes: [37]
  right:
    names: [ArrowRight]
    codes: [ArrowRight]
    keycodes: [39]
  jump:            # 游戏内「跳跃」= Z（与「确定」同键）
    names: [z]
    codes: [KeyZ]
    keycodes: [90]
  attack:          # 游戏内「咸鱼攻击」= X
    names: [x]
    codes: [KeyX]
    keycodes: [88]
  dash:            # 游戏内「冲刺」= C（用户确认）。注意引擎的 Input.keyMapper 把
                   # 67(C) 映射成内部名 "bullet"，那只是内部命名，不是「发射子弹」——
                   # 不要因为这个名字去改这里的绑定。
    names: [c]
    codes: [KeyC]
    keycodes: [67]
  special:         # 游戏内「咸鱼技能」= V
    names: [v]
    codes: [KeyV]
    keycodes: [86]
  interact:        # 游戏内「确定」= Z（同 jump）；Enter 也能确认
    names: [z, Enter]
    codes: [KeyZ, Enter]
    keycodes: [90, 13]
  menu:            # 游戏内「打开菜单」= ESC
    names: [Escape]
    codes: [Escape]
    keycodes: [27]
  cancel:          # 游戏内「取消」= X（与攻击同键）
    names: [x]
    codes: [KeyX]
    keycodes: [88]
  ult:             # 游戏内「必杀技」= A（释放当前咸鱼武器的对应大招）
    names: [a]
    codes: [KeyA]
    keycodes: [65]
  item:            # 游戏内「使用物品」= F（就地使用当前选中物品；唯一的即时回血手段）
    names: [f]
    codes: [KeyF]
    keycodes: [70]
  weapon_switch:   # 游戏内「更换武器」= S；切换咸鱼武器
    #   引擎核实：Game_Player.controlWeaponChange() 读输入名 "cfish"，
    #   而 keyMapper 里 83(KeyS) -> "cfish"。所以 S 是切换键，
    #   与 game.yaml 原有的 J/I/K(视角)、F(物品)、M(地图) 不同类。
    names: [s]
    codes: [KeyS]
    keycodes: [83]
